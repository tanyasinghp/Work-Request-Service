# Serves the built app and proxies /api to the backend, so the browser talks to one origin.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Docker's DNS, re-resolved per request: the web container starts even while the api is
    # down (the UI then shows "API not reachable"), and a restarted api is found at its new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        # Keep the original host:port so Spring sees a same-origin request, not a CORS one.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 5m;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints asset names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths get index.html, which is never cached.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
