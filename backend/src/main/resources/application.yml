spring:
  application:
    name: work-request-service

server:
  error:
    # The @RestControllerAdvice owns error bodies; never leak internals from the fallback page.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  request:
    # Checked before the body is parsed; larger bodies get a 413.
    max-body-size: 2MB
  batch:
    max-size: 5000
  cors:
    allowed-origins: http://localhost:5173
