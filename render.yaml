# Render Blueprint for the API. The web app is deployed separately on Vercel (see DEPLOY.md).
services:
  - type: web
    name: work-request-service-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # The container serves on 8080; telling Render so avoids its default port guess.
      - key: PORT
        value: "8080"
      # The exact Vercel origin(s), comma-separated, e.g. https://work-request-service.vercel.app.
      # No wildcards: the app refuses to start with one. Set in the dashboard (sync: false).
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Heap sizing comes from the Dockerfile's -XX:MaxRAMPercentage=75 (a ceiling, not actual use).
